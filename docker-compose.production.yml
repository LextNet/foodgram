version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    container_name: foodgram-db
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  frontend:
    container_name: foodgram-frontend
    image: enterinet/foodgram_frontend
    volumes:
      - static:/app/result_build
  backend:
    container_name: foodgram-backend
    image: enterinet/foodgram_backend
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/media
    depends_on:
      - db
      - frontend
  nginx:
    container_name: foodgram-proxy
    image: enterinet/foodgram_gateway
    ports:
      - "9080:80"
    volumes:
      - static:/static/
      - media:/media/