server {
    listen 80;
    client_max_body_size 10M;
    server_tokens off;

    gzip                on;
    gzip_min_length     500;
    gzip_vary           on;
    gzip_proxied        expired no-cache no-store private auth;
    gzip_types          text/plain text/css text/javascript application/javascript application/x-javascript text/xml application/xml application/xml+rss application/json;
    gzip_disable        "msie6";
    gzip_comp_level     6;
    gzip_buffers        16 8k;

    index index.html;    

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }
    
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location /static/ {
        alias /static/;
        try_files $uri $uri/ @frontend_static;
    }

    location /media/ {
        alias /media/;
    }

    location @frontend_static {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

}
